name: Build VST3 (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --target VUSteel_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VU-Steel-VST3
          path: build/VUSteel_artifacts/Release/VST3/
